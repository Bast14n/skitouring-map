image: node:24-alpine

stages: [build, deploy]

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

pages:
  stage: deploy
  needs: [build]
  script:
    - mv dist public
  artifacts:
    paths: [public/]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
